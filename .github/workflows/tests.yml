name: Neuro-CXG CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Lint and type check
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -e .
          pip install ruff black mypy

      - name: Run Ruff linter
        run: ruff check src/ || true

      - name: Run Black formatter check
        run: black --check src/ || true

      - name: Run MyPy type checking
        run: mypy src/core/ src/models/ --ignore-missing-imports || true

  # Unit tests with coverage
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e .
          pip install pytest pytest-cov

      - name: Run unit tests with coverage
        run: |
          pytest tests/unit/ -v --tb=short \
            --cov=src --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests

  # Integration tests (requires data)
  integration-tests:
    runs-on: ubuntu-latest
    if: false  # Disable by default - requires data
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -e .

      - name: Run integration tests
        run: pytest tests/integration/ -v --tb=short || echo "Skipped - requires data"

  # Docker build test
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t neuro-cxg:test .
        continue-on-error: true

      - name: Test Docker run
        if: success()
        run: |
          docker run --rm neuro-cxg:test python -c "from src.core.config import validate_environment; print('Docker OK')" || echo "Docker test failed"

  # Multi-seed stability (if checkpoints exist)
  multi-seed-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -e .

      - name: Check multi-seed results
        run: |
          if [ -d "models/checkpoints" ]; then
            echo "Checkpoints exist - running multi-seed analysis"
            python -c "
import json
from pathlib import Path
results = []
for seed in [42, 123, 456]:
    p = Path(f'results/evaluation_seed_{seed}/comprehensive_results.json')
    if p.exists():
        with open(p) as f:
            results.append(json.load(f)['ensemble_metrics']['auc'])
if results:
    print(f'Multi-seed AUCs: {[round(x,4) for x in results]}')
    print(f'Mean: {sum(results)/len(results):.4f}, Std: {(max(results)-min(results)):.4f}')
else:
    echo 'No multi-seed results found'
          "
          else
            echo "No checkpoints - skipping multi-seed check"
          fi

  # Code quality checks
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -e .

      - name: Check for hardcoded paths
        run: |
          grep -r "data/raw" src/ --include="*.py" | grep -v "config\|path" | head -5 || echo "No hardcoded paths found"
          grep -r "/home/" src/ --include="*.py" | grep -v "sys.path" | head -5 || echo "No home paths found"

      - name: Verify config imports
        run: |
          python -c "
from src.core.config import (
    NUM_LOBES, CAUSALITY_METHOD, GNN_IN_CHANNELS,
    CHECKPOINT_DIR, DATA_DIR, RESULTS_DIR
)
print('Config imports OK')
print(f'CAUSALITY_METHOD={CAUSALITY_METHOD}')
print(f'NUM_LOBES={NUM_LOBES}')
"

  # Documentation check
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required docs exist
        run: |
          required_docs=(
            "README.md"
            "docs/TEST_SET_PROTOCOL.md"
            "docs/LITERATURE_COMPARISON.md"
            "docs/CV_TEST_GAP.md"
            "docs/README.md"
            "docs/paper/ablations.md"
            "docs/paper/methods.md"
          )
          
          missing=()
          for doc in "${required_docs[@]}"; do
            if [ ! -f "$doc" ]; then
              missing+=("$doc")
            fi
          done
          
          if [ ${#missing[@]} -eq 0 ]; then
            echo "All required docs present"
          else
            echo "Missing docs: ${missing[*]}"
            exit 1
          fi