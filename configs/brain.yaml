# Neuro-CXG YOLO dataset config
# Used by src/features/extract_spatial.py via CONFIG_BRAIN_YAML
#
# The 'path' field is resolved relative to the working directory when running
# inside Docker (WORKDIR=/workspace) or from the project root.
# Override at runtime with the NEURO_CXG_DATA_ROOT environment variable;
# see src/core/paths.py for how PROJECT_ROOT is derived.

path: ./data/final
train: train/images
val: val/images
test: test/images

# 12 neuroanatomical classes (must match class_id in generate_labels.py)
nc: 12
names:
  0: Frontal_Superior
  1: Frontal_Orbital
  2: Motor_Premotor
  3: Insula
  4: Cingulate
  5: Limbic
  6: Occipital
  7: Parietal
  8: Temporal
  9: Subcortical
  10: Cerebellum
  11: Brainstem
