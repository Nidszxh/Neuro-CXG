name: Neuro-CXG
channels:
  - pytorch
  - pyg
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python>=3.10,<3.13
  - pip>=23.0

  # Core ML - PyTorch with CUDA 12.1 (cu121)
  # Note: torch version is pinned in requirements.txt (avoid redundancy)
  - pytorch-cuda=12.1

  # GNN
  - pyg::torch-geometric==2.7.0

  # Neuroimaging
  - nibabel==5.3.3
  - nilearn==0.12.1
  - neuroHarmonize==2.4.5

  # Interpretability
  - captum==0.8.0

  # AWS S3
  - boto3==1.42.17

  # YOLO
  - ultralytics==8.4.5

  # ML utilities
  - scikit-learn==1.8.0
  - numpy==1.26.4
  - pandas==2.3.3
  - scipy==1.15.3
  - statsmodels==0.14.6
  - tqdm==4.67.1

  # Visualization
  - matplotlib==3.10.8
  - seaborn==0.13.2
  - networkx==3.5
  - pillow==12.0.0

  # Experiment tracking & notebooks
  - jupyter==1.0.0
  - ipykernel==6.27.1

  # Testing
  - pytest==9.0.2
  - pytest-cov==4.1.0

  # Optional: for faster installs
  - pip:
    - pytorch>2.9.0
    # torch-scatter and torch-sparse are optional C++ extensions
    # Uncomment if you want faster scatter/gather operations:
    # - torch-scatter
    # - torch-sparse
    # - torch-cluster
    # - torch-spline-conv

  # Development tools (optional)
  - black>=24.0.0
  - ruff>=0.4.0
  - mypy>=1.8.0

variables:
  CUDA_VERSION: "12.1"
  TORCH_CUDA_VERSION: "cu121"